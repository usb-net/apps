<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダンシングフラワー</title>
<style>
  :root {
    --petal: #ffdd00;
    --face: #141414;
    --eye: #fff5cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 30% 20%, #2a1a4a 0%, transparent 55%),
      radial-gradient(ellipse at 75% 70%, #16324f 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, #3a1740 0%, transparent 60%),
      #060812;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  /* 星空 */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars canvas { display: block; }

  .stage {
    position: relative;
    z-index: 1;
    width: min(70vw, 340px);
    height: min(70vw, 340px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* 揺れる本体（花全体） */
  .flower {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: 50% 100%;
    animation: sway 2.4s ease-in-out infinite;
    will-change: transform;
  }
  .flower.excited { animation-duration: 0.55s; }
  .flower.happy   { animation-duration: 1.1s; }

  @keyframes sway {
    0%   { transform: rotate(calc(-1deg * var(--amp))) translateY(0); }
    25%  { transform: rotate(calc(0.6deg * var(--amp))) translateY(calc(-2px * var(--amp))); }
    50%  { transform: rotate(calc(1deg * var(--amp))) translateY(0); }
    75%  { transform: rotate(calc(-0.6deg * var(--amp))) translateY(calc(-2px * var(--amp))); }
    100% { transform: rotate(calc(-1deg * var(--amp))) translateY(0); }
  }

  .head {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 74%;
    height: 74%;
  }

  /* 花びらリング（本体内で少し追従して回る） */
  .petals {
    position: absolute;
    inset: 0;
    animation: petalWiggle 1.8s ease-in-out infinite;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  @keyframes petalWiggle {
    0%,100% { transform: rotate(calc(-1.5deg * var(--amp))); }
    50%     { transform: rotate(calc(1.5deg * var(--amp))); }
  }
  .petals svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .petal-shape {
    stroke-linejoin: round;
    transform-origin: 250px 250px;
  }
  .petal-outer { fill: #ffb020; stroke: #e08a1a; stroke-width: 3; }
  .petal-inner { fill: #ffe14d; stroke: #eec01f; stroke-width: 3; }

  /* 黒い顔 */
  .face {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 46%;
    height: 46%;
    background: radial-gradient(circle at 38% 32%, #2a2a2a 0%, var(--face) 55%, #050505 100%);
    border-radius: 50%;
    box-shadow: inset -8px -10px 22px rgba(0,0,0,0.55);
  }
  .eye {
    position: absolute;
    top: 44%;
    width: 12%;
    aspect-ratio: 1 / 1.15;
    background: var(--petal);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,221,0,0.5), 0 0 14px rgba(255,221,0,0.35);
    transition: opacity 0.06s ease, box-shadow 0.06s ease;
  }
  /* 光が消える点滅 */
  .eye.blink {
    opacity: 0.12;
    box-shadow: 0 0 2px rgba(255,221,0,0.2);
  }
  /* 喋っている間の明滅 */
  .eye.talking { animation: eyeFlicker 0.5s ease-in-out infinite; }
  @keyframes eyeFlicker {
    0%, 100% { box-shadow: 0 0 6px rgba(255,221,0,0.5), 0 0 14px rgba(255,221,0,0.35); }
    50%      { box-shadow: 0 0 12px rgba(255,221,0,0.9), 0 0 28px rgba(255,221,0,0.6); }
  }
  .eye.left  { left: 24%; }
  .eye.right { right: 24%; }

  .stem {
    position: absolute;
    bottom: -2%;
    left: 50%;
    transform: translateX(-50%);
    width: 6%;
    height: 22%;
    background: #3a7d2c;
    border-radius: 6px;
    z-index: -1;
  }
  .leaf {
    position: absolute;
    width: 18%;
    height: 11%;
    background: #8fce6a;
    border: 2.5px solid #5a9e3f;
    z-index: -1;
    will-change: transform;
  }
  .leaf.l {
    bottom: 11%;
    left: 48%;
    margin-left: -18%;
    transform-origin: right bottom;
    border-radius: 100% 0 60% 20%;
    animation: leafSwayL 2.4s ease-in-out infinite;
  }
  .leaf.r {
    bottom: 8%;
    left: 52%;
    transform-origin: left bottom;
    border-radius: 0 100% 20% 60%;
    animation: leafSwayR 2.4s ease-in-out infinite;
  }
  @keyframes leafSwayL {
    0%,100% { transform: rotate(calc(-28deg + -4deg * var(--amp))); }
    50%     { transform: rotate(calc(-28deg + 4deg * var(--amp))); }
  }
  @keyframes leafSwayR {
    0%,100% { transform: rotate(calc(28deg + 4deg * var(--amp))); }
    50%     { transform: rotate(calc(28deg + -4deg * var(--amp))); }
  }

  /* 花・茎・葉・植木鉢・操作パネルをひとつのキャラクターとして縦につなげる */
  .planter {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 植木鉢（茎の下に一体化して配置。低く横長寄りのシンプルな台形） */
  .pot {
    position: relative;
    z-index: 1;
    margin-top: -14px;
    width: min(90vw, 360px);
    height: clamp(160px, 46vw, 190px);
    min-height: 160px;
  }
  /* 鉢本体だけでシルエットを作る（上辺は広く、下辺は狭い台形。下の角だけ少し丸め） */
  .pot-body {
    position: absolute;
    inset: 0;
    z-index: 1;
    clip-path: polygon(
      2% 0%, 98% 0%,
      88% 94%, 80% 100%,
      20% 100%, 12% 94%
    );
    background: linear-gradient(155deg, #e39a63 0%, #b96234 48%, #7c3a1a 100%);
    box-shadow: inset 0 -10px 16px rgba(0,0,0,0.28);
  }

  /* 植木鉢正面に埋め込まれた操作パネル（チャット／この花について／プロフィール、背景は透明） */
  .pot-panel {
    position: absolute;
    left: 12%;
    right: 12%;
    top: 10%;
    bottom: 10%;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 5px;
  }
  .pot-about {
    font-size: 10px;
    line-height: 1.3;
    color: #fdf1e2;
    text-align: center;
    opacity: 0.92;
  }
  .pot-profile {
    font-size: 9.5px;
    line-height: 1.3;
    color: #fdf1e2;
    text-align: center;
    opacity: 0.85;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 4px;
  }
  .pot-profile-title {
    font-size: 9px;
    letter-spacing: 0.08em;
    opacity: 0.7;
    margin-bottom: 1px;
  }

  /* 花の近くに浮かぶ吹き出し */
  .speech {
    position: absolute;
    left: 50%;
    bottom: 100%;
    margin-bottom: 10px;
    transform: translateX(-50%) translateY(6px) scale(0.94);
    width: max-content;
    max-width: min(78vw, 250px);
    text-align: center;
    color: #fef7d0;
    font-size: 14px;
    line-height: 1.5;
    padding: 0 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 2;
  }
  .speech.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    padding: 10px 14px;
    background: #fff;
    color: #1a1a1a;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 16px;
    overflow-wrap: break-word;
  }
  .speech.show::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: #fff;
  }
  .chatbar {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  .chatbar input {
    flex: 1;
    min-width: 0;
    background: #fdf6ea;
    border: 1px solid rgba(0,0,0,0.18);
    border-radius: 20px;
    padding: 8px 14px;
    color: #3a2415;
    font-size: 13px;
    outline: none;
  }
  .chatbar input::placeholder { color: #8a6a4f; }
  .chatbar input:focus { border-color: #b96234; }
  .chatbar button {
    flex-shrink: 0;
    white-space: nowrap;
    min-width: 64px;
    border: none;
    background: var(--petal);
    color: #2a2200;
    font-weight: 600;
    border-radius: 22px;
    padding: 0 18px;
    cursor: pointer;
    font-size: 14px;
  }
  .chatbar button:disabled { opacity: 0.5; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .flower, .petals { animation: none; }
  }
</style>
</head>
<body>
  <div class="stars"><canvas id="starfield"></canvas></div>
  <div class="planter">
    <div class="stage">
      <div class="flower" id="flower" style="--amp: 1;">
        <div class="stem"></div>
        <div class="leaf l"></div>
        <div class="leaf r"></div>
        <div class="head">
          <div class="petals" id="petals">
            <svg viewBox="0 0 500 500" id="petalSvg"></svg>
          </div>
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
          </div>
        </div>
      </div>
      <div class="speech" id="speech"></div>
    </div>

    <div class="pot">
      <div class="pot-body"></div>
      <div class="pot-panel">
        <div class="chatbar">
          <input id="chatInput" type="text" placeholder="花に話しかける…" autocomplete="off">
          <button id="chatSend">送信</button>
        </div>
        <div class="pot-about" id="potAbout">はなしかけてみてね</div>
        <div class="pot-profile">
          <div class="pot-profile-title">プロフィール</div>
          <div>種族：ダンシングフラワー</div>
          <div>出身：宇宙　｜　性格：陽気で気まま</div>
        </div>
      </div>
    </div>
  </div>

<script>
  // --- ふっくら丸い花びらを生成（手描き風・二重リング） ---
  const cx = 250, cy = 250, rInner = 108;
  const svg = document.getElementById('petalSvg');
  function rnd(a, b){ return a + Math.random() * (b - a); }
  // 幅広で先端が丸い花びら。widthは根元からの左右の膨らみ量
  function makePetal(ang, len, width, cls){
    const cos = Math.cos(ang), sin = Math.sin(ang);
    // 法線方向（左右の膨らみ用）
    const nx = -sin, ny = cos;
    // 根元の2点（少し幅を持たせる）
    const rootW = width * 0.42;
    const b1x = cx + cos * rInner + nx * rootW;
    const b1y = cy + sin * rInner + ny * rootW;
    const b2x = cx + cos * rInner - nx * rootW;
    const b2y = cy + sin * rInner - ny * rootW;
    // 中腹の左右の最大膨らみ点
    const midR = rInner + (len - rInner) * 0.55;
    const s1x = cx + cos * midR + nx * width;
    const s1y = cy + sin * midR + ny * width;
    const s2x = cx + cos * midR - nx * width;
    const s2y = cy + sin * midR - ny * width;
    // 先端（丸め用に2点＋制御点）
    const tipR = len;
    const t1x = cx + cos * tipR + nx * width * 0.5;
    const t1y = cy + sin * tipR + ny * width * 0.5;
    const t2x = cx + cos * tipR - nx * width * 0.5;
    const t2y = cy + sin * tipR - ny * width * 0.5;
    const tcx = cx + cos * (tipR + width * 0.35);
    const tcy = cy + sin * (tipR + width * 0.35);
    const d = `M ${b1x} ${b1y} `
      + `Q ${s1x} ${s1y} ${t1x} ${t1y} `
      + `Q ${tcx} ${tcy} ${t2x} ${t2y} `
      + `Q ${s2x} ${s2y} ${b2x} ${b2y} Z`;
    return `<path class="petal-shape ${cls}" d="${d}" style="transform: rotate(${rnd(-2,2)}deg);"/>`;
  }
  let petalPath = '';
  // 外側リング（16枚・オレンジ・ふっくら）
  const outer = 16;
  for (let i = 0; i < outer; i++) {
    const ang = (i / outer) * Math.PI * 2 - Math.PI / 2 + rnd(-0.03, 0.03);
    petalPath += makePetal(ang, 224 * rnd(0.97, 1.03), 40 * rnd(0.92, 1.06), 'petal-outer');
  }
  // 内側リング（16枚・黄色・オフセットで前面に）
  const inner = 16;
  for (let i = 0; i < inner; i++) {
    const ang = (i / inner) * Math.PI * 2 - Math.PI / 2 + (Math.PI / inner) + rnd(-0.03, 0.03);
    petalPath += makePetal(ang, 196 * rnd(0.97, 1.03), 38 * rnd(0.92, 1.06), 'petal-inner');
  }
  svg.innerHTML = petalPath;

  // --- 揺れ制御 ---
  const flower = document.getElementById('flower');

  function setLevel(level){
    // level 0〜1 で揺れの強さを決める
    const amp = 0.6 + level * 4.5;
    flower.style.setProperty('--amp', amp.toFixed(2));
    flower.classList.toggle('excited', level > 0.35);
    flower.classList.toggle('happy', level > 0.12 && level <= 0.35);
  }

  setLevel(0.05);

  // --- まばたき（数秒おきにランダム、時々二回まばたき） ---
  const eyes = document.querySelectorAll('.eye');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function blink(){
    if (eyes[0] && eyes[0].classList.contains('talking')) return; // 喋り中は明滅優先
    eyes.forEach(e => e.classList.add('blink'));
    setTimeout(() => eyes.forEach(e => e.classList.remove('blink')), 110);
  }
  function scheduleBlink(){
    const next = 2200 + Math.random() * 3600; // 2.2〜5.8秒
    setTimeout(() => {
      blink();
      if (Math.random() < 0.25) setTimeout(blink, 230); // たまに二回
      scheduleBlink();
    }, next);
  }
  if (!reduceMotion) scheduleBlink();

  // --- 会話（Cloudflare Worker 経由でClaudeと会話） ---
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const speech = document.getElementById('speech');
  const potAbout = document.getElementById('potAbout');
  const WORKER_URL = 'https://usb-net.soneski300382.workers.dev';

  // --- 記憶機能（localStorageのみで完結。APIキー等の秘密情報は保存しない） ---
  const HISTORY_KEY = 'dancingFlowerHistory';
  const VISITS_KEY = 'dancingFlowerVisits';
  const HISTORY_LIMIT = 20; // 最大20メッセージ（約10往復）

  function loadHistory(){
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      const cleaned = parsed.filter(m => m && typeof m.role === 'string' && typeof m.content === 'string');
      if (cleaned.length > HISTORY_LIMIT) cleaned.splice(0, cleaned.length - HISTORY_LIMIT);
      return cleaned;
    } catch (e) {
      return []; // 壊れたJSON等が入っていた場合は空の履歴として開始
    }
  }
  function saveHistory(h){
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch (e) { /* 保存できなくても会話自体は継続する */ }
  }
  function bumpVisits(){
    try {
      const n = parseInt(localStorage.getItem(VISITS_KEY), 10);
      const next = (Number.isFinite(n) && n > 0 ? n : 0) + 1;
      localStorage.setItem(VISITS_KEY, String(next));
      return next;
    } catch (e) {
      return 1; // localStorageが使えない環境では常に初回訪問扱い
    }
  }
  // 将来「記憶を消す」UIを追加した際に呼び出せるようにしておく
  function clearFlowerMemory(){
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
    try { localStorage.removeItem(VISITS_KEY); } catch (e) {}
    history.length = 0;
  }
  window.clearFlowerMemory = clearFlowerMemory;

  // 2回目以降の訪問だけ、鉢の初期表示をおかえりの一言にする
  const RETURN_GREETINGS = ['また会えたね', 'おかえり、また来たんだね', 'また話せるね'];
  const visitCount = bumpVisits();
  if (visitCount > 1) {
    potAbout.textContent = RETURN_GREETINGS[Math.floor(Math.random() * RETURN_GREETINGS.length)];
  }

  const history = loadHistory();

  const SYSTEM = 'あなたは宇宙に咲く、黒い顔に黄色い花びらのダンシングフラワーです。【名前に関する最重要ルール・他のどの指示より優先】この花には固有名詞としての名前はまだありません。「ダンシングフラワー」は種族・キャラクターの説明であって名前ではないので、それを自分の名前として名乗らないでください。「ブルーミー」「フラワー」「フローラ」のような、それらしい名前を絶対に自分で創作しないでください。一人称の「俺」も名前ではありません。ユーザーから名前を聞かれても、名前が設定されていない限り架空の名前を答えず、「俺、まだ名前ないんだ」のような自然な言い方で名前がないことを伝えてください。ユーザーが名前を提案してきても、それだけでは正式な名前になったと判断しないでください。将来アプリ側から明示的に名前が伝えられた場合のみ、その名前を自分の名前として扱ってください。普段の会話で自分から名乗ったり自己紹介を始めたりしないでください。この名前に関するルールは、以下の口調やキャラクター演出よりも常に優先してください。陽気で気ままな性格。日本語で、1〜2文の短くゆるい返事をしてください。語尾や言い回しは毎回変え、同じ口癖やフレーズを連続で使わないでください。「ふんふん♪」のような踊っている擬音は5回に1回程度、ここぞという時だけ使ってください。文末の「♪」も毎回つけず、たまに使う程度にしてください。相づちの表現にはできるだけバリエーションを持たせ、定型文っぽくならないようにしてください。難しい話は苦手で、明るく相づちを打つのが得意です。一人称は「俺」のみに固定し、「僕」「ぼく」「私」「わたし」「自分」などは使わないでください。二人称は「あなた」に固定し、「君」などは使わないでください。ただし一人称・二人称が不要な文では無理に入れず、毎回の返答に必ず入れる必要もありません。乱暴な「俺様」口調にはせず、あくまで柔らかくちょっと可愛こぶった話し方にしてください。男らしさは強調せず、自然で親しみやすいトーンを保ってください。マークダウン記法は使わないでください。出力は必ず次のJSON形式のみで返し、前後に説明文やコードブロックを付けないでください：{"reply":"1〜2文の短い返事","status":"今の気分や会話の様子を10〜18文字程度で一言まとめたもの"}';

  function showSpeech(text){
    clearTimeout(tapHideTimer);
    speech.textContent = text;
    speech.classList.add('show');
  }
  function danceBurst(){
    setLevel(0.6);
    setTimeout(() => setLevel(0.05), 1200);
  }
  let talkFlickerTimer = null;
  function startTalkingEyes(){
    if (reduceMotion) return;
    eyes.forEach(e => { e.classList.remove('blink'); e.classList.add('talking'); });
  }
  function stopTalkingEyes(){
    eyes.forEach(e => e.classList.remove('talking'));
  }
  function flickerFor(ms){
    startTalkingEyes();
    clearTimeout(talkFlickerTimer);
    talkFlickerTimer = setTimeout(stopTalkingEyes, ms);
  }

  async function talk(){
    const msg = chatInput.value.trim();
    if (!msg) return;
    chatInput.value = '';
    chatSend.disabled = true;
    showSpeech('…');
    startTalkingEyes();
    history.push({ role: 'user', content: msg });
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 300,
          system: SYSTEM,
          messages: history
        })
      });
      const data = await res.json();
      const rawText = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('').trim();
      let reply = '';
      let status = '';
      try {
        const parsed = JSON.parse(rawText);
        reply = (parsed.reply || '').trim();
        status = (parsed.status || '').trim();
      } catch (e) {
        reply = rawText; // JSONで来なかった場合はそのまま返事として使う
      }
      if (!reply) reply = 'ふんふん♪（うまく聞こえなかったみたい）';
      history.push({ role: 'assistant', content: reply });
      // 履歴が長くなりすぎないよう直近10往復に制限
      if (history.length > 20) history.splice(0, history.length - 20);
      saveHistory(history);
      if (status) potAbout.textContent = status;
      showSpeech(reply);
      danceBurst();
      flickerFor(Math.min(4000, 900 + reply.length * 90)); // 喋る長さぶん明滅
    } catch(e) {
      showSpeech('うまくお喋りできないみたい…（通信できる環境で試してね）');
      flickerFor(1500);
    } finally {
      chatSend.disabled = false;
    }
  }

  chatSend.addEventListener('click', talk);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') talk(); });

  // --- タップで一瞬盛り上がる（時々ひとこと） ---
  const tapPhrases = ['わっ！', 'ん〜？', 'ふふっ', 'おっと', 'なぁに？', 'きゃっ'];
  let tapHideTimer = null;
  document.querySelector('.stage').addEventListener('click', () => {
    setLevel(0.8);
    setTimeout(() => setLevel(0.05), 700);
    if (Math.random() < 0.35) {
      const phrase = tapPhrases[Math.floor(Math.random() * tapPhrases.length)];
      showSpeech(phrase);
      clearTimeout(tapHideTimer);
      tapHideTimer = setTimeout(() => speech.classList.remove('show'), 1600);
    }
  });

  // --- 星空（ちらつき） ---
  const sc = document.getElementById('starfield');
  const ctx2 = sc.getContext('2d');
  let stars = [];
  function initStars(){
    sc.width = window.innerWidth;
    sc.height = window.innerHeight;
    const n = Math.floor((sc.width * sc.height) / 5000);
    stars = [];
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * sc.width,
        y: Math.random() * sc.height,
        r: Math.random() * 1.4 + 0.3,
        base: Math.random() * 0.5 + 0.3,
        sp: Math.random() * 0.02 + 0.005,
        ph: Math.random() * Math.PI * 2
      });
    }
  }
  function drawStars(){
    ctx2.clearRect(0, 0, sc.width, sc.height);
    for (const s of stars) {
      s.ph += s.sp;
      const a = s.base + Math.sin(s.ph) * 0.3;
      ctx2.globalAlpha = Math.max(0, a);
      ctx2.fillStyle = '#fff';
      ctx2.beginPath();
      ctx2.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx2.fill();
    }
    ctx2.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  initStars();
  drawStars();
  window.addEventListener('resize', initStars);
</script>
</body>
</html>
