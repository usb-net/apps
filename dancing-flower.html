<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダンシングフラワー</title>
<style>
  :root {
    --petal: #ffdd00;
    --face: #141414;
    --eye: #fff5cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 30% 20%, #2a1a4a 0%, transparent 55%),
      radial-gradient(ellipse at 75% 70%, #16324f 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, #3a1740 0%, transparent 60%),
      #060812;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  /* 星空 */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars canvas { display: block; }

  .stage {
    position: relative;
    z-index: 1;
    width: min(70vw, 340px);
    height: min(70vw, 340px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* 揺れる本体（花全体） */
  .flower {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: 50% 100%;
    animation: sway 2.4s ease-in-out infinite;
    will-change: transform;
  }
  .flower.excited { animation-duration: 0.55s; }
  .flower.happy   { animation-duration: 1.1s; }

  /* 会話内容に応じた感情モーション（emotionMotion()で付け外しする。idle=sway/petalWiggleへ戻る） */
  @keyframes emoHappy {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    15%  { transform: rotate(-6deg) translateY(-3px); }
    35%  { transform: rotate(6deg) translateY(-3px); }
    55%  { transform: rotate(-5deg) translateY(-2px); }
    75%  { transform: rotate(5deg) translateY(-2px); }
    90%  { transform: rotate(-2deg) translateY(0); }
  }
  .flower.emo-happy { animation: emoHappy 1.6s ease-in-out 1; }

  @keyframes petalBounce {
    0%, 100% { transform: scale(1); }
    25%  { transform: scale(1.05); }
    50%  { transform: scale(0.97); }
    75%  { transform: scale(1.03); }
  }
  .petals.emo-happy { animation: petalBounce 1.6s ease-in-out 1; }

  @keyframes emoExcited {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    10% { transform: rotate(-10deg) translateY(-6px); }
    20% { transform: rotate(10deg) translateY(-6px); }
    30% { transform: rotate(-9deg) translateY(-5px); }
    40% { transform: rotate(9deg) translateY(-5px); }
    50% { transform: rotate(-7deg) translateY(-4px); }
    60% { transform: rotate(7deg) translateY(-4px); }
    75% { transform: rotate(-4deg) translateY(-2px); }
    88% { transform: rotate(3deg) translateY(0); }
  }
  .flower.emo-excited { animation: emoExcited 0.9s ease-in-out 1; }

  @keyframes emoSurprise {
    0%   { transform: scale(1) translateY(0); }
    30%  { transform: scale(1.12) translateY(-10px); }
    55%  { transform: scale(1.05) translateY(-4px); }
    100% { transform: scale(1) translateY(0); }
  }
  .flower.emo-surprise { animation: emoSurprise 0.45s ease-out 1; }

  @keyframes emoThinking {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(var(--think-dir, -4deg)); }
  }
  .flower.emo-thinking { animation: emoThinking 1.2s ease-in-out 1 forwards; }

  @keyframes emoShy {
    0%, 100% { transform: rotate(0deg) scale(0.97); }
    25% { transform: rotate(-2deg) scale(0.95); }
    50% { transform: rotate(2deg) scale(0.96); }
    75% { transform: rotate(-1deg) scale(0.97); }
  }
  .flower.emo-shy { animation: emoShy 1.4s ease-in-out 1; }

  @keyframes emoSad {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(6px) rotate(-1deg); }
  }
  .flower.emo-sad { animation: emoSad 1.3s ease-in-out 1 forwards; }

  @keyframes emoDance {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    10% { transform: rotate(-8deg); }
    20% { transform: rotate(8deg); }
    30% { transform: rotate(-8deg); }
    40% { transform: rotate(8deg); }
    55% { transform: rotate(-5deg) translateY(-8px); }
    70% { transform: rotate(5deg) translateY(-6px); }
    85% { transform: rotate(-2deg) translateY(-2px); }
  }
  .flower.emo-dance { animation: emoDance 2s ease-in-out 1; }

  /* --- タップ/クリックで「撫でられて喜ぶ」専用モーション（petMotion()で付け外し） --- */
  @keyframes petSway {
    0%, 100% { transform: rotate(0deg) translateX(0); }
    15% { transform: rotate(-3deg) translateX(-2px); }
    30% { transform: rotate(3deg) translateX(2px); }
    45% { transform: rotate(-3deg) translateX(-2px); }
    60% { transform: rotate(3deg) translateX(2px); }
    75% { transform: rotate(-1.5deg) translateX(-1px); }
    90% { transform: rotate(1deg) translateX(0); }
  }
  .flower.pet-sway { animation: petSway 1s ease-in-out 1; }

  @keyframes leafPetUpL {
    0%, 100% { transform: rotate(-28deg); }
    30% { transform: rotate(-72deg); }
    60% { transform: rotate(-58deg); }
  }
  @keyframes leafPetUpR {
    0%, 100% { transform: rotate(28deg); }
    30% { transform: rotate(72deg); }
    60% { transform: rotate(58deg); }
  }
  .leaf.l.pet-leaf-up { animation: leafPetUpL 0.9s ease-in-out 1; }
  .leaf.r.pet-leaf-up { animation: leafPetUpR 0.9s ease-in-out 1; }

  /* 撫でたときのハート・音符（DOMに一時要素を追加してJS側で削除する） */
  .pet-effect-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: visible;
  }
  .pet-particle {
    position: absolute;
    bottom: 42%;
    transform: translate(-50%, 0) scale(0.6);
    font-size: 18px;
    color: #ffb3c6;
    text-shadow: 0 0 6px rgba(255,150,180,0.6);
    opacity: 0;
    animation: petFloat 1.1s ease-out forwards;
  }
  @keyframes petFloat {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
    15%  { opacity: 1; transform: translate(-50%, -10px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(1.1); }
  }
  /* prefers-reduced-motion時は控えめに、ふわっとした移動なしの単純なフェードにする */
  .pet-particle.reduced {
    animation: petFadeOnly 0.6s ease-out forwards;
  }
  @keyframes petFadeOnly {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
    30%  { opacity: 0.9; }
    100% { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
  }

  @keyframes sway {
    0%   { transform: rotate(calc(-1deg * var(--amp))) translateY(0); }
    25%  { transform: rotate(calc(0.6deg * var(--amp))) translateY(calc(-2px * var(--amp))); }
    50%  { transform: rotate(calc(1deg * var(--amp))) translateY(0); }
    75%  { transform: rotate(calc(-0.6deg * var(--amp))) translateY(calc(-2px * var(--amp))); }
    100% { transform: rotate(calc(-1deg * var(--amp))) translateY(0); }
  }

  .head {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 74%;
    height: 74%;
  }

  /* 花びらリング（本体内で少し追従して回る） */
  .petals {
    position: absolute;
    inset: 0;
    animation: petalWiggle 1.8s ease-in-out infinite;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  @keyframes petalWiggle {
    0%,100% { transform: rotate(calc(-1.5deg * var(--amp))); }
    50%     { transform: rotate(calc(1.5deg * var(--amp))); }
  }
  .petals svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .petal-shape {
    stroke-linejoin: round;
    transform-origin: 250px 250px;
  }
  .petal-outer { fill: #ffb020; stroke: #e08a1a; stroke-width: 3; }
  .petal-inner { fill: #ffe14d; stroke: #eec01f; stroke-width: 3; }

  /* 黒い顔 */
  .face {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 46%;
    height: 46%;
    background: radial-gradient(circle at 38% 32%, #2a2a2a 0%, var(--face) 55%, #050505 100%);
    border-radius: 50%;
    box-shadow: inset -8px -10px 22px rgba(0,0,0,0.55);
  }
  .eye {
    position: absolute;
    top: 44%;
    width: 12%;
    aspect-ratio: 1 / 1.15;
    background: var(--petal);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,221,0,0.5), 0 0 14px rgba(255,221,0,0.35);
    transition: opacity 0.06s ease, box-shadow 0.06s ease;
  }
  /* 光が消える点滅 */
  .eye.blink {
    opacity: 0.12;
    box-shadow: 0 0 2px rgba(255,221,0,0.2);
  }
  /* 喋っている間の明滅 */
  .eye.talking { animation: eyeFlicker 0.5s ease-in-out infinite; }
  @keyframes eyeFlicker {
    0%, 100% { box-shadow: 0 0 6px rgba(255,221,0,0.5), 0 0 14px rgba(255,221,0,0.35); }
    50%      { box-shadow: 0 0 12px rgba(255,221,0,0.9), 0 0 28px rgba(255,221,0,0.6); }
  }
  .eye.left  { left: 24%; }
  .eye.right { right: 24%; }

  .stem {
    position: absolute;
    bottom: -2%;
    left: 50%;
    transform: translateX(-50%);
    width: 6%;
    height: 22%;
    background: #3a7d2c;
    border-radius: 6px;
    z-index: -1;
  }
  .leaf {
    position: absolute;
    width: 18%;
    height: 11%;
    background: #8fce6a;
    border: 2.5px solid #5a9e3f;
    z-index: -1;
    will-change: transform;
  }
  .leaf.l {
    bottom: 11%;
    left: 48%;
    margin-left: -18%;
    transform-origin: right bottom;
    border-radius: 100% 0 60% 20%;
    animation: leafSwayL 2.4s ease-in-out infinite;
  }
  .leaf.r {
    bottom: 8%;
    left: 52%;
    transform-origin: left bottom;
    border-radius: 0 100% 20% 60%;
    animation: leafSwayR 2.4s ease-in-out infinite;
  }
  @keyframes leafSwayL {
    0%,100% { transform: rotate(calc(-28deg + -4deg * var(--amp))); }
    50%     { transform: rotate(calc(-28deg + 4deg * var(--amp))); }
  }
  @keyframes leafSwayR {
    0%,100% { transform: rotate(calc(28deg + 4deg * var(--amp))); }
    50%     { transform: rotate(calc(28deg + -4deg * var(--amp))); }
  }

  /* 花・茎・葉・植木鉢・操作パネルをひとつのキャラクターとして縦につなげる */
  .planter {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 植木鉢（茎の下に一体化して配置。低く横長寄りのシンプルな台形） */
  .pot {
    position: relative;
    z-index: 1;
    margin-top: -14px;
    width: min(90vw, 360px);
    height: clamp(160px, 46vw, 190px);
    min-height: 160px;
  }
  /* 鉢本体だけでシルエットを作る（上辺は広く、下辺は狭い台形。下の角だけ少し丸め） */
  .pot-body {
    position: absolute;
    inset: 0;
    z-index: 1;
    clip-path: polygon(
      2% 0%, 98% 0%,
      88% 94%, 80% 100%,
      20% 100%, 12% 94%
    );
    background: linear-gradient(155deg, #e39a63 0%, #b96234 48%, #7c3a1a 100%);
    box-shadow: inset 0 -10px 16px rgba(0,0,0,0.28);
  }

  /* 植木鉢正面に埋め込まれた操作パネル（チャット／この花について／プロフィール、背景は透明） */
  .pot-panel {
    position: absolute;
    left: 12%;
    right: 12%;
    top: 10%;
    bottom: 10%;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 5px;
  }
  .pot-about {
    font-size: 10px;
    line-height: 1.3;
    color: #fdf1e2;
    text-align: center;
    opacity: 0.92;
  }
  .pot-profile {
    font-size: 9.5px;
    line-height: 1.3;
    color: #fdf1e2;
    text-align: center;
    opacity: 0.85;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 4px;
  }
  .pot-profile-title {
    font-size: 9px;
    letter-spacing: 0.08em;
    opacity: 0.7;
    margin-bottom: 1px;
  }

  /* 花の近くに浮かぶ吹き出し */
  .speech {
    position: absolute;
    left: 50%;
    bottom: 100%;
    margin-bottom: 10px;
    transform: translateX(-50%) translateY(6px) scale(0.94);
    width: max-content;
    max-width: min(78vw, 250px);
    text-align: center;
    color: #fef7d0;
    font-size: 14px;
    line-height: 1.5;
    padding: 0 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 2;
  }
  .speech.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    padding: 10px 14px;
    background: #fff;
    color: #1a1a1a;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 16px;
    overflow-wrap: break-word;
  }
  .speech.show::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: #fff;
  }
  .chatbar {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  .chatbar input {
    flex: 1;
    min-width: 0;
    background: #fdf6ea;
    border: 1px solid rgba(0,0,0,0.18);
    border-radius: 20px;
    padding: 8px 14px;
    color: #3a2415;
    font-size: 13px;
    outline: none;
  }
  .chatbar input::placeholder { color: #8a6a4f; }
  .chatbar input:focus { border-color: #b96234; }
  .chatbar button {
    flex-shrink: 0;
    white-space: nowrap;
    min-width: 64px;
    border: none;
    background: var(--petal);
    color: #2a2200;
    font-weight: 600;
    border-radius: 22px;
    padding: 0 18px;
    cursor: pointer;
    font-size: 14px;
  }
  .chatbar button:disabled { opacity: 0.5; cursor: default; }

  /* チャット入力欄のすぐ下・鉢の外側に、小さく控えめな命名方法の案内を表示 */
  .naming-hint {
    position: relative;
    z-index: 1;
    width: min(90vw, 360px);
    margin: 8px auto 0;
    text-align: center;
    font-size: 10px;
    line-height: 1.5;
    color: rgba(255,255,255,0.5);
  }

  /* 会話と記憶についての説明（植木鉢の外側・下に小さく配置） */
  .privacy-note {
    position: relative;
    z-index: 1;
    width: min(90vw, 360px);
    margin: 10px auto 0;
    text-align: center;
  }
  .privacy-toggle {
    background: none;
    border: none;
    color: rgba(255,255,255,0.45);
    font-size: 11px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .privacy-toggle:hover { color: rgba(255,255,255,0.7); }
  .privacy-panel {
    margin-top: 6px;
    padding: 10px 12px;
    text-align: left;
  }
  .privacy-panel[hidden] { display: none; }
  .privacy-heading {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    margin-bottom: 4px;
  }
  .privacy-body,
  .privacy-note-text {
    font-size: 10.5px;
    line-height: 1.6;
    color: rgba(255,255,255,0.55);
    margin-bottom: 6px;
  }
  .privacy-reset {
    display: block;
    margin: 8px auto 0;
    background: none;
    border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.6);
    font-size: 10.5px;
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
  }
  .privacy-reset:hover { color: #fff; border-color: rgba(255,255,255,0.45); }

  /* ほかのアプリへのリンク（「会話と記憶について」よりさらに下・控えめな半透明ボタン） */
  .other-apps {
    position: relative;
    z-index: 1;
    width: min(90vw, 360px);
    margin: 14px auto 24px;
    text-align: center;
  }
  .other-apps-title {
    font-size: 10.5px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 8px;
  }
  .other-apps-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .other-apps-links a {
    flex: 0 1 auto;
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .other-apps-links a:hover,
  .other-apps-links a:focus-visible {
    background: rgba(255,255,255,0.14);
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }

  @media (prefers-reduced-motion: reduce) {
    /* emo-*・pet-* クラスは.flower/.petals単体より詳細度が高いため、
       !importantで確実に大きな動きを抑える */
    .flower, .petals { animation: none !important; }
    .leaf.pet-leaf-up { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="stars"><canvas id="starfield"></canvas></div>
  <div class="planter">
    <div class="stage">
      <div class="flower" id="flower" style="--amp: 1;">
        <div class="stem"></div>
        <div class="leaf l"></div>
        <div class="leaf r"></div>
        <div class="head">
          <div class="petals" id="petals">
            <svg viewBox="0 0 500 500" id="petalSvg"></svg>
          </div>
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
          </div>
        </div>
      </div>
      <div class="speech" id="speech"></div>
      <div class="pet-effect-layer" id="petEffectLayer"></div>
    </div>

    <div class="pot">
      <div class="pot-body"></div>
      <div class="pot-panel">
        <div class="chatbar">
          <input id="chatInput" type="text" placeholder="花に話しかける…" autocomplete="off">
          <button id="chatSend">送信</button>
        </div>
        <div class="pot-about" id="potAbout">はなしかけてみてね</div>
        <div class="pot-profile">
          <div class="pot-profile-title">プロフィール</div>
          <div>種族：ダンシングフラワー</div>
          <div>出身：宇宙　｜　性格：陽気で気まま</div>
        </div>
      </div>
    </div>
  </div>

  <div class="naming-hint">※名前をつけるときは「○○にするね」のように話しかけてください。</div>

  <div class="privacy-note">
    <button type="button" id="privacyToggle" class="privacy-toggle" aria-expanded="false" aria-controls="privacyPanel">会話と記憶について</button>
    <div class="privacy-panel" id="privacyPanel" hidden>
      <div class="privacy-heading">この花との会話について</div>
      <p class="privacy-body">この花の会話履歴は、このブラウザ内に保存されます。サイト運営者が、ブラウザに保存された会話履歴を一覧で確認する仕組みはありません。</p>
      <p class="privacy-note-text">天気情報：<a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a></p>
      <button type="button" id="resetMemoryBtn" class="privacy-reset">会話をリセット</button>
    </div>
  </div>

  <div class="other-apps">
    <div class="other-apps-title">ほかのアプリ</div>
    <div class="other-apps-links">
      <a href="block-battle.html">テトリス</a>
      <a href="othello.html">オセロ</a>
      <a href="talk-cards.html">はなしのたね</a>
    </div>
  </div>

<script>
  // --- ふっくら丸い花びらを生成（手描き風・二重リング） ---
  const cx = 250, cy = 250, rInner = 108;
  const svg = document.getElementById('petalSvg');
  function rnd(a, b){ return a + Math.random() * (b - a); }
  // 幅広で先端が丸い花びら。widthは根元からの左右の膨らみ量
  function makePetal(ang, len, width, cls){
    const cos = Math.cos(ang), sin = Math.sin(ang);
    // 法線方向（左右の膨らみ用）
    const nx = -sin, ny = cos;
    // 根元の2点（少し幅を持たせる）
    const rootW = width * 0.42;
    const b1x = cx + cos * rInner + nx * rootW;
    const b1y = cy + sin * rInner + ny * rootW;
    const b2x = cx + cos * rInner - nx * rootW;
    const b2y = cy + sin * rInner - ny * rootW;
    // 中腹の左右の最大膨らみ点
    const midR = rInner + (len - rInner) * 0.55;
    const s1x = cx + cos * midR + nx * width;
    const s1y = cy + sin * midR + ny * width;
    const s2x = cx + cos * midR - nx * width;
    const s2y = cy + sin * midR - ny * width;
    // 先端（丸め用に2点＋制御点）
    const tipR = len;
    const t1x = cx + cos * tipR + nx * width * 0.5;
    const t1y = cy + sin * tipR + ny * width * 0.5;
    const t2x = cx + cos * tipR - nx * width * 0.5;
    const t2y = cy + sin * tipR - ny * width * 0.5;
    const tcx = cx + cos * (tipR + width * 0.35);
    const tcy = cy + sin * (tipR + width * 0.35);
    const d = `M ${b1x} ${b1y} `
      + `Q ${s1x} ${s1y} ${t1x} ${t1y} `
      + `Q ${tcx} ${tcy} ${t2x} ${t2y} `
      + `Q ${s2x} ${s2y} ${b2x} ${b2y} Z`;
    return `<path class="petal-shape ${cls}" d="${d}" style="transform: rotate(${rnd(-2,2)}deg);"/>`;
  }

  for (let i = 0; i < outer; i++) {

  // reply/statusの内容からごく簡単に状態を判定する

  // --- 記憶機能（localStorageのみで完結。APIキー等の秘密情報は保存しない） ---
  const HISTORY_KEY = 'dancingFlowerHistory';

  // ユーザーの発言が「花への命名」かどうかを判定する。

  // 名前候補を話題にしただけ・呼びかけ・別の話題の可能性がある発言では反応せず、
  // 命名する意思が明確な言い回しのときだけ名前を抽出する。
  // 名前の単体入力（例：「マックス」）だけでは、候補を言っただけ・呼びかけ・

  const NAMING_REJECT_WORDS = ['それ', 'これ', 'あれ', 'どれ', 'そう', 'こう', 'そっち', 'こっち', 'なし', '無し'];
  function detectNamingIntent(text){
    if (!text) return null;
    const cleaned = text.trim().replace(/[。！!？?\s]+$/g, '');
    const patterns = [
      /^(?:今日から)?(.+?)って呼ぶ(?:ね|よ|ことにするね|ことにする)$/,
      /^(?:今日から)?(.+?)って呼んで(?:ね|よ)$/,
      /^(?:今日から)?(.+?)って名前(?:ね|だよ|にしよう|にするね|にする)$/,
      /^(?:今日から)?(.+?)っていう名前(?:ね|だよ|にしよう|にするね|にする)$/,
      /^(?:今日から)?(.+?)って名付け(?:る(?:ね|よ)|よう)$/,
      /^名前は(.+?)(?:にしよう|にするね|にする|だよ|ね|で)$/,
      /^今日から(.+?)ね$/,
      /^(?:今日から)?(.+?)にする(?:ね|よ)?$/,
      /^(?:今日から)?(.+?)にしよう$/,
      /^(.+?)でいこう$/,
    ];
    for (const re of patterns) {
      const m = cleaned.match(re);
      if (m && m[1]) {
        const name = m[1].trim().replace(/^[「『"']+|[」』"']+$/g, '');
        if (
          name.length >= 1 && name.length <= 12 &&
          !/[?？]/.test(name) &&
          !NAMING_REJECT_WORDS.includes(name)
        ) {
          return name;
        }
      }
    }
    return null;
  }

【現在の正式な名前・たった今決まりました】

      : currentName

    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * sc.width,
        y: Math.random() * sc.height,
        r: Math.random() * 1.4 + 0.3,
        base: Math.random() * 0.5 + 0.3,
        sp: Math.random() * 0.02 + 0.005,
        ph: Math.random() * Math.PI * 2
      });
    }
  }
  function drawStars(){
    ctx2.clearRect(0, 0, sc.width, sc.height);
    for (const s of stars) {
      s.ph += s.sp;
      const a = s.base + Math.sin(s.ph) * 0.3;
      ctx2.globalAlpha = Math.max(0, a);
      ctx2.fillStyle = '#fff';
      ctx2.beginPath();
      ctx2.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx2.fill();
    }
    ctx2.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  initStars();
  drawStars();
  window.addEventListener('resize', initStars);

  // --- 会話と記憶についての説明（開閉）と記憶リセット（既存のclearFlowerMemory()を利用） ---
  const privacyToggle = document.getElementById('privacyToggle');
  const privacyPanel = document.getElementById('privacyPanel');
  const resetMemoryBtn = document.getElementById('resetMemoryBtn');

  privacyToggle.addEventListener('click', () => {
    const willShow = privacyPanel.hasAttribute('hidden');
    if (willShow) {
      privacyPanel.removeAttribute('hidden');
    } else {
      privacyPanel.setAttribute('hidden', '');
    }
    privacyToggle.setAttribute('aria-expanded', String(willShow));
  });

  resetMemoryBtn.addEventListener('click', () => {
    if (!confirm('これまでの会話履歴をリセットしますか？')) return;
    clearConversationHistory(); // 会話履歴のみ削除（訪問記録・長期記憶は残す）
    potAbout.textContent = 'またここから話そっか';
  });
</script>
</body>
</html>
