<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダンシングフラワー</title>
<style>
  :root {
    --petal: #ffdd00;
    --face: #141414;
    --eye: #fff5cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 30% 20%, #2a1a4a 0%, transparent 55%),
      radial-gradient(ellipse at 75% 70%, #16324f 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, #3a1740 0%, transparent 60%),
      #060812;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  /* 星空 */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars canvas { display: block; }

  .stage {
    position: relative;
    z-index: 1;
    width: min(70vw, 340px);
    height: min(70vw, 340px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* 揺れる本体（花全体） */
  .flower {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: 50% 100%;
    animation: sway 2.4s ease-in-out infinite;
    will-change: transform;
  }
  .flower.excited { animation-duration: 0.55s; }
  .flower.happy   { animation-duration: 1.1s; }

  @keyframes sway {
    0%   { transform: rotate(calc(-1deg * var(--amp))) translateY(0); }
    25%  { transform: rotate(calc(0.6deg * var(--amp))) translateY(calc(-2px * var(--amp))); }
    50%  { transform: rotate(calc(1deg * var(--amp))) translateY(0); }
    75%  { transform: rotate(calc(-0.6deg * var(--amp))) translateY(calc(-2px * var(--amp))); }
    100% { transform: rotate(calc(-1deg * var(--amp))) translateY(0); }
  }

  .head {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 74%;
    height: 74%;
  }

  /* 花びらリング（本体内で少し追従して回る） */
  .petals {
    position: absolute;
    inset: 0;
    animation: petalWiggle 1.8s ease-in-out infinite;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  @keyframes petalWiggle {
    0%,100% { transform: rotate(calc(-1.5deg * var(--amp))); }
    50%     { transform: rotate(calc(1.5deg * var(--amp))); }
  }
  .petals svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .petal-shape {
    stroke-linejoin: round;
    transform-origin: 250px 250px;
  }
  .petal-outer { fill: #ffb020; stroke: #e08a1a; stroke-width: 3; }
  .petal-inner { fill: #ffe14d; stroke: #eec01f; stroke-width: 3; }

  /* 黒い顔 */
  .face {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 46%;
    height: 46%;
    background: radial-gradient(circle at 38% 32%, #2a2a2a 0%, var(--face) 55%, #050505 100%);
    border-radius: 50%;
    box-shadow: inset -8px -10px 22px rgba(0,0,0,0.55);
  }
  .eye {
    position: absolute;
    top: 44%;
    width: 12%;
    aspect-ratio: 1 / 1.15;
    background: var(--petal);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,221,0,0.5), 0 0 14px rgba(255,221,0,0.35);
    transition: opacity 0.06s ease, box-shadow 0.06s ease;
  }
  /* 光が消える点滅 */
  .eye.blink {
    opacity: 0.12;
    box-shadow: 0 0 2px rgba(255,221,0,0.2);
  }
  /* 喋っている間の明滅 */
  .eye.talking { animation: eyeFlicker 0.5s ease-in-out infinite; }
  @keyframes eyeFlicker {
    0%, 100% { box-shadow: 0 0 6px rgba(255,221,0,0.5), 0 0 14px rgba(255,221,0,0.35); }
    50%      { box-shadow: 0 0 12px rgba(255,221,0,0.9), 0 0 28px rgba(255,221,0,0.6); }
  }
  .eye.left  { left: 24%; }
  .eye.right { right: 24%; }

  .stem {
    position: absolute;
    bottom: -2%;
    left: 50%;
    transform: translateX(-50%);
    width: 6%;
    height: 22%;
    background: #3a7d2c;
    border-radius: 6px;
    z-index: -1;
  }
  .leaf {
    position: absolute;
    width: 18%;
    height: 11%;
    background: #8fce6a;
    border: 2.5px solid #5a9e3f;
    z-index: -1;
    will-change: transform;
  }
  .leaf.l {
    bottom: 11%;
    left: 48%;
    margin-left: -18%;
    transform-origin: right bottom;
    border-radius: 100% 0 60% 20%;
    animation: leafSwayL 2.4s ease-in-out infinite;
  }
  .leaf.r {
    bottom: 8%;
    left: 52%;
    transform-origin: left bottom;
    border-radius: 0 100% 20% 60%;
    animation: leafSwayR 2.4s ease-in-out infinite;
  }
  @keyframes leafSwayL {
    0%,100% { transform: rotate(calc(-28deg + -4deg * var(--amp))); }
    50%     { transform: rotate(calc(-28deg + 4deg * var(--amp))); }
  }
  @keyframes leafSwayR {
    0%,100% { transform: rotate(calc(28deg + 4deg * var(--amp))); }
    50%     { transform: rotate(calc(28deg + -4deg * var(--amp))); }
  }

  .controls {
    position: relative;
    z-index: 1;
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .mic-btn {
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
    color: #fff;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 40px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: transform 0.1s, background 0.2s;
  }
  .mic-btn:active { transform: scale(0.96); }
  .mic-btn.on { background: #d94a2b; border-color: #ff7a52; }
  .mic-btn:focus-visible { outline: 3px solid #ffdd00; outline-offset: 2px; }
  .hint { font-size: 12px; color: #9a9db5; height: 16px; }

  .speech {
    max-width: 260px;
    min-height: 0;
    text-align: center;
    color: #fef7d0;
    font-size: 14px;
    line-height: 1.5;
    padding: 0 8px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .speech.show {
    opacity: 1;
    padding: 10px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,221,0,0.25);
    border-radius: 14px;
  }
  .chatbar {
    display: flex;
    gap: 8px;
    width: min(84vw, 320px);
  }
  .chatbar input {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 22px;
    padding: 11px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .chatbar input::placeholder { color: #8a8da5; }
  .chatbar input:focus { border-color: rgba(255,221,0,0.5); }
  .chatbar button {
    border: none;
    background: var(--petal);
    color: #2a2200;
    font-weight: 600;
    border-radius: 22px;
    padding: 0 18px;
    cursor: pointer;
    font-size: 14px;
  }
  .chatbar button:disabled { opacity: 0.5; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .flower, .petals { animation: none; }
  }
</style>
</head>
<body>
  <div class="stars"><canvas id="starfield"></canvas></div>
  <div class="stage">
    <div class="flower" id="flower" style="--amp: 1;">
      <div class="stem"></div>
      <div class="leaf l"></div>
      <div class="leaf r"></div>
      <div class="head">
        <div class="petals" id="petals">
          <svg viewBox="0 0 500 500" id="petalSvg"></svg>
        </div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="mic-btn" id="micBtn">🎤 マイクで踊らせる</button>
    <div class="speech" id="speech"></div>
    <div class="chatbar">
      <input id="chatInput" type="text" placeholder="花に話しかける…" autocomplete="off">
      <button id="chatSend">送信</button>
    </div>
    <div class="hint" id="hint">タップでも反応します</div>
  </div>

<script>
  // --- ふっくら丸い花びらを生成（手描き風・二重リング） ---
  const cx = 250, cy = 250, rInner = 108;
  const svg = document.getElementById('petalSvg');
  function rnd(a, b){ return a + Math.random() * (b - a); }
  // 幅広で先端が丸い花びら。widthは根元からの左右の膨らみ量
  function makePetal(ang, len, width, cls){
    const cos = Math.cos(ang), sin = Math.sin(ang);
    // 法線方向（左右の膨らみ用）
    const nx = -sin, ny = cos;
    // 根元の2点（少し幅を持たせる）
    const rootW = width * 0.42;
    const b1x = cx + cos * rInner + nx * rootW;
    const b1y = cy + sin * rInner + ny * rootW;
    const b2x = cx + cos * rInner - nx * rootW;
    const b2y = cy + sin * rInner - ny * rootW;
    // 中腹の左右の最大膨らみ点
    const midR = rInner + (len - rInner) * 0.55;
    const s1x = cx + cos * midR + nx * width;
    const s1y = cy + sin * midR + ny * width;
    const s2x = cx + cos * midR - nx * width;
    const s2y = cy + sin * midR - ny * width;
    // 先端（丸め用に2点＋制御点）
    const tipR = len;
    const t1x = cx + cos * tipR + nx * width * 0.5;
    const t1y = cy + sin * tipR + ny * width * 0.5;
    const t2x = cx + cos * tipR - nx * width * 0.5;
    const t2y = cy + sin * tipR - ny * width * 0.5;
    const tcx = cx + cos * (tipR + width * 0.35);
    const tcy = cy + sin * (tipR + width * 0.35);
    const d = `M ${b1x} ${b1y} `
      + `Q ${s1x} ${s1y} ${t1x} ${t1y} `
      + `Q ${tcx} ${tcy} ${t2x} ${t2y} `
      + `Q ${s2x} ${s2y} ${b2x} ${b2y} Z`;
    return `<path class="petal-shape ${cls}" d="${d}" style="transform: rotate(${rnd(-2,2)}deg);"/>`;
  }
  let petalPath = '';
  // 外側リング（16枚・オレンジ・ふっくら）
  const outer = 16;
  for (let i = 0; i < outer; i++) {
    const ang = (i / outer) * Math.PI * 2 - Math.PI / 2 + rnd(-0.03, 0.03);
    petalPath += makePetal(ang, 224 * rnd(0.97, 1.03), 40 * rnd(0.92, 1.06), 'petal-outer');
  }
  // 内側リング（16枚・黄色・オフセットで前面に）
  const inner = 16;
  for (let i = 0; i < inner; i++) {
    const ang = (i / inner) * Math.PI * 2 - Math.PI / 2 + (Math.PI / inner) + rnd(-0.03, 0.03);
    petalPath += makePetal(ang, 196 * rnd(0.97, 1.03), 38 * rnd(0.92, 1.06), 'petal-inner');
  }
  svg.innerHTML = petalPath;

  // --- 揺れ制御 ---
  const flower = document.getElementById('flower');
  const micBtn = document.getElementById('micBtn');
  const hint = document.getElementById('hint');
  let audioCtx, analyser, dataArr, rafId, micOn = false;

  function setLevel(level){
    // level 0〜1 で揺れの強さを決める
    const amp = 0.6 + level * 4.5;
    flower.style.setProperty('--amp', amp.toFixed(2));
    flower.classList.toggle('excited', level > 0.35);
    flower.classList.toggle('happy', level > 0.12 && level <= 0.35);
  }

  async function startMic(){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      dataArr = new Uint8Array(analyser.frequencyBinCount);
      micOn = true;
      micBtn.textContent = '⏹ 停止';
      micBtn.classList.add('on');
      hint.textContent = '音に反応しています';
      loop();
    } catch(e) {
      hint.textContent = 'マイクを使えません（HTTPS環境が必要です）';
    }
  }

  function stopMic(){
    micOn = false;
    cancelAnimationFrame(rafId);
    if (audioCtx) audioCtx.close();
    micBtn.textContent = '🎤 マイクで踊らせる';
    micBtn.classList.remove('on');
    hint.textContent = 'タップでも反応します';
    setLevel(0.05);
  }

  function loop(){
    analyser.getByteFrequencyData(dataArr);
    let sum = 0;
    for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
    const avg = sum / dataArr.length / 255;      // 0〜1
    const level = Math.min(1, Math.pow(avg * 2.4, 1.3));
    setLevel(level);
    rafId = requestAnimationFrame(loop);
  }

  micBtn.addEventListener('click', () => micOn ? stopMic() : startMic());

  // タップで一瞬盛り上がる（マイクなしでも遊べる）
  document.querySelector('.stage').addEventListener('click', () => {
    if (micOn) return;
    setLevel(0.8);
    setTimeout(() => setLevel(0.05), 700);
  });

  setLevel(0.05);

  // --- まばたき（数秒おきにランダム、時々二回まばたき） ---
  const eyes = document.querySelectorAll('.eye');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function blink(){
    if (eyes[0] && eyes[0].classList.contains('talking')) return; // 喋り中は明滅優先
    eyes.forEach(e => e.classList.add('blink'));
    setTimeout(() => eyes.forEach(e => e.classList.remove('blink')), 110);
  }
  function scheduleBlink(){
    const next = 2200 + Math.random() * 3600; // 2.2〜5.8秒
    setTimeout(() => {
      blink();
      if (Math.random() < 0.25) setTimeout(blink, 230); // たまに二回
      scheduleBlink();
    }, next);
  }
  if (!reduceMotion) scheduleBlink();

  // --- 会話（Cloudflare Worker 経由でClaudeと会話） ---
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const speech = document.getElementById('speech');
  const WORKER_URL = 'https://usb-net.soneski300382.workers.dev';
  const history = [];

  const SYSTEM = 'あなたは宇宙に咲く、黒い顔に黄色い花びらのダンシングフラワーです。陽気で気ままな性格。日本語で、1〜2文の短くゆるい返事をしてください。時々「ふんふん♪」など踊っている様子を混ぜても構いません。難しい話は苦手で、明るく相づちを打つのが得意です。マークダウン記法は使わないでください。';

  function showSpeech(text){
    speech.textContent = text;
    speech.classList.add('show');
  }
  function danceBurst(){
    setLevel(0.6);
    setTimeout(() => { if (!micOn) setLevel(0.05); }, 1200);
  }
  let talkFlickerTimer = null;
  function startTalkingEyes(){
    if (reduceMotion) return;
    eyes.forEach(e => { e.classList.remove('blink'); e.classList.add('talking'); });
  }
  function stopTalkingEyes(){
    eyes.forEach(e => e.classList.remove('talking'));
  }
  function flickerFor(ms){
    startTalkingEyes();
    clearTimeout(talkFlickerTimer);
    talkFlickerTimer = setTimeout(stopTalkingEyes, ms);
  }

  async function talk(){
    const msg = chatInput.value.trim();
    if (!msg) return;
    chatInput.value = '';
    chatSend.disabled = true;
    showSpeech('…');
    startTalkingEyes();
    history.push({ role: 'user', content: msg });
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 300,
          system: SYSTEM,
          messages: history
        })
      });
      const data = await res.json();
      const reply = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('').trim() || 'ふんふん♪（うまく聞こえなかったみたい）';
      history.push({ role: 'assistant', content: reply });
      // 履歴が長くなりすぎないよう直近10往復に制限
      if (history.length > 20) history.splice(0, history.length - 20);
      showSpeech(reply);
      danceBurst();
      flickerFor(Math.min(4000, 900 + reply.length * 90)); // 喋る長さぶん明滅
    } catch(e) {
      showSpeech('うまくお喋りできないみたい…（通信できる環境で試してね）');
      flickerFor(1500);
    } finally {
      chatSend.disabled = false;
    }
  }

  chatSend.addEventListener('click', talk);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') talk(); });

  // --- 星空（ちらつき） ---
  const sc = document.getElementById('starfield');
  const ctx2 = sc.getContext('2d');
  let stars = [];
  function initStars(){
    sc.width = window.innerWidth;
    sc.height = window.innerHeight;
    const n = Math.floor((sc.width * sc.height) / 5000);
    stars = [];
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * sc.width,
        y: Math.random() * sc.height,
        r: Math.random() * 1.4 + 0.3,
        base: Math.random() * 0.5 + 0.3,
        sp: Math.random() * 0.02 + 0.005,
        ph: Math.random() * Math.PI * 2
      });
    }
  }
  function drawStars(){
    ctx2.clearRect(0, 0, sc.width, sc.height);
    for (const s of stars) {
      s.ph += s.sp;
      const a = s.base + Math.sin(s.ph) * 0.3;
      ctx2.globalAlpha = Math.max(0, a);
      ctx2.fillStyle = '#fff';
      ctx2.beginPath();
      ctx2.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx2.fill();
    }
    ctx2.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  initStars();
  drawStars();
  window.addEventListener('resize', initStars);
</script>
</body>
</html>
