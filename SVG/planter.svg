<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160">
  <defs>
    <linearGradient id="potBodyGrad" x1="15%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#eba26c"/>
      <stop offset="46%" stop-color="#b96234"/>
      <stop offset="100%" stop-color="#762f16"/>
    </linearGradient>
    <clipPath id="potBodyClip">
      <path d="M 20,14 C 16,90 10,138 52,150 Q 38,160 66,160 L 234,160 Q 262,160 248,150 C 290,138 284,90 280,14 L 300,0 L 0,0 L 20,14 Z"/>
    </clipPath>
  </defs>

  <!-- 胴体：上が広く下にすぼまる、側面はゆるやかに外側へ膨らむ曲線、底の角も丸め。
       上端は(20,14)/(280,14)からさらに(300,0)/(0,0)まで全幅で伸ばし、
       CSS側の.pot-rim（鉢の唯一のフチ）と隙間なくつながるようにしている。 -->
  <path fill="url(#potBodyGrad)" d="M 20,14 C 16,90 10,138 52,150 Q 38,160 66,160 L 234,160 Q 262,160 248,150 C 290,138 284,90 280,14 L 300,0 L 0,0 L 20,14 Z"/>

  <!-- 胴体下部のごく軽い陰影（陶器感を出しすぎない程度） -->
  <ellipse cx="150" cy="158" rx="130" ry="24" fill="#000000" opacity="0.15" clip-path="url(#potBodyClip)"/>
</svg>
